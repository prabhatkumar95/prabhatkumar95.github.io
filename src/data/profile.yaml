projects:
  - id: "roku-video-mamba"
    title: "Multi-Modal Video Architecture & Temporal Modeling"
    org: "Roku"
    period: "Dec 2025 – Present"
    tagline: "Scalable Long-Context Video Modeling & Boundary Localization"
    challenge: "Long-form multi-modal scene break detection requiring high-throughput boundary localization across asynchronous video, audio, and subtitle streams where standard Transformers encounter quadratic memory scaling ($O(N^2)$)."
    architecture: "Benchmarked linear-complexity State-Space Models (Mamba) and Graph Convolutional Networks (GCNs) against standard Transformers. Engineered self-supervised proxy tasks aligning visual (DINO), textual, and acoustic embeddings for precise boundary localization."
    impact: "Scaled distributed feature extraction and validation across ultra-long video datasets using Ray, cutting processing bottlenecks and enabling localized structural reasoning."
    tags: ["PyTorch", "Ray", "State-Space Models (Mamba)", "DINO", "Transformers", "GCNs", "Distributed Scale"]

  - id: "bosch-zero-shot"
    title: "Zero-Shot Perception Transfer & Cross-Camera Flow"
    org: "Bosch Research"
    period: "2022 – 2025"
    tagline: "Unsupervised Sensor Transfer & Dual-Level Domain Adaptation"
    challenge: "Sensor recalibration and domain drift across heterogeneous multi-sensor vehicle and industrial cameras without expensive manual ground-truth annotation."
    architecture: "Coupled a UNIT-GAN translation network with a FlowFormer optical flow backbone to warp visual representations across pixel and latent feature levels, maximizing cross-domain geometric consistency."
    impact: "Enabled unsupervised model and label transfer across heterogeneous sensors; directly produced 3 Published Patents (1 US Patent, 2 Indian Patents) in cross-camera vision."
    tags: ["Computer Vision", "FlowFormer", "UNIT-GAN", "Domain Adaptation", "PyTorch", "3 Published Patents"]

  - id: "ola-edge-ai"
    title: "Low-Latency Autonomous Systems & Multi-Task Edge AI"
    org: "Ola Electric"
    period: "2021 – 2022"
    tagline: "Real-Time Embedded Multi-Task Perception on Robotic Hardware"
    challenge: "Joint perception for unstructured road environments under strict compute, memory, and millisecond latency constraints on embedded automotive hardware."
    architecture: "Engineered a unified multi-task deep network for simultaneous semantic segmentation and depth estimation trained with hybrid supervised and self-supervised geometric constraints."
    impact: "Accelerated execution via TensorRT running within an onboard ROS/ROS2 robotics environment under sub-millisecond real-time constraints."
    tags: ["C++", "ROS/ROS2", "TensorRT", "Edge AI", "Multi-Task Learning", "Semantic Segmentation", "Depth Estimation"]

experience:
