    summary: "Promoted to Tech Lead (Jul 2025); served as R&D Specialist (Oct 2022 – Jun 2025) driving autonomous perception."
    bullets:
      - "Developed unsupervised cross-camera optical flow estimation by coupling a UNIT-GAN translation network with a FlowFormer backbone, enabling zero-shot model and label transfer across heterogeneous sensors."
      - "Formulated dual-level domain adaptation objectives using predicted dense flow fields to warp visual representations at both pixel and latent feature levels, maximizing cross-domain geometric consistency."
      - "Leveraged flow-based feature alignment to jointly regularize and improve representation capacity across source and target camera perception networks, resulting in 3 published patents."

  - company: "Ola Electric"
    role: "Research Engineer I"
    period: "Jul 2021 – Sep 2022"
    location: "Bengaluru, India"
    summary: "Developed onboard computer vision and multi-task learning for robotic perception."
    bullets:
      - "Developed a unified multi-task network for joint Semantic Segmentation and Depth Estimation tailored for unstructured road environments using hybrid supervised and self-supervised training."
      - "Implemented domain adaptation pipelines and novel geometric and photometric data augmentations to minimize feature degradation against severe out-of-distribution driving conditions."
      - "Evaluated model efficiency and real-world inference constraints by adapting neural architectures for low-latency execution via TensorRT within an onboard ROS robotics environment."

  - company: "IISc & IIT Jodhpur"
