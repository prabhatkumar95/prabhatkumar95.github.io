    period: "Dec 2025 – Present"
    location: "Bengaluru, India"
    summary: "Leading research and engineering in multi-modal video understanding architectures."
    bullets:
      - "Researched multi-modal Scene Break Detection, scaling temporal sequence modeling by benchmarking linear-complexity State-Space Models (Mamba) and GCNs against standard Transformers."
