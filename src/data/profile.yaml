    bullets:
      - "Indian Institute of Science (IISc): Formulated a self-supervised representation learning framework (SISL) to decouple content-independent camera signatures from image patches, training an anomaly localization network to identify splicing boundaries without pixel-level ground truth."
      - "IIT Jodhpur: Developed a multi-stream deep neural network to isolate regional artifacts and spatial-temporal texture distortions from facial reenactment pipelines, mapping model robustness across progressive video compression codecs (published in WACV 2020)."

